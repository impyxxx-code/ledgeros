<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LedgerOS</title>

    <!-- Tabler icons — loaded here so they work on the login page before app CSS injects -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css" />

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- iOS home screen icon — must be PNG, 180x180 -->
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

    <!-- iOS PWA meta -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="LedgerOS" />

    <!-- Android PWA -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#060d1f" />
    <meta name="application-name" content="LedgerOS" />

    <!-- SEO -->
    <meta name="description" content="LedgerOS — VAT invoices, inventory and analytics for Arkham Retail" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
